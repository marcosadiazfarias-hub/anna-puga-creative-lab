<!-- TOAST NOTIFICATION -->
@if (toastMessage(); as msg) {
  <div
    class="fixed bottom-6 right-6 z-50 max-w-sm bg-[#CCFF00] text-black font-grotesk font-bold px-5 py-3.5 rounded-xl border-2 border-black shadow-[6px_6px_0px_#7C3AED] flex items-center gap-3"
  >
    <span class="w-2.5 h-2.5 rounded-full bg-black animate-ping"></span>
    <span class="text-sm">{{ msg }}</span>
  </div>
}
